[project]
name = "sahayak-backend"
version = "0.1.0"
description = "Offline NPU-first meeting copilot backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.34",
    "alembic==1.13.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pydantic-extra-types==2.6.0",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "httpx==0.27.2",
    "websockets==12.0",
    "onnxruntime==1.19.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "requests==2.32.3",
    "tqdm==4.66.5",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.13.1",
    "httpx==0.27.2",
    "ruff==0.6.5",
    "mypy==1.11.2",
    "types-requests==2.31.0.0",
    "pre-commit==3.8.0",
]
genai = [
    "onnxruntime-genai==0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIC", "PL", "TRY", "PD", "RUF", "ARG", "PTH", "ERA", "RET", "ASYNC"]
ignore = ["S101", "PLW0601", "TRY003", "ARG001", "ARG002"]
fixable = ["ALL"]
unfixable = ["T20", "S101", "PLW0601"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
exclude = ["alembic", "scripts", "tests/fixtures"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*", "*/scripts/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"